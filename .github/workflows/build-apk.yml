name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "android/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download and extract Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.12.1-bin.zip -o /tmp/gradle.zip
          python3 -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" /tmp/gradle.zip /tmp
          chmod 755 /tmp/gradle-8.12.1/bin/gradle

      - name: Read current version
        id: version
        run: |
          # Extract versionCode from build.gradle.kts, or default to 1
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts 2>/dev/null || echo "1")
          echo "current_version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Current versionCode: $VERSION_CODE"

      - name: Bump version code
        id: bump
        run: |
          NEW_VERSION_CODE=$((${{ steps.version.outputs.current_version_code }} + 1))
          # Format as XX with leading zero for alpha-1.XX format
          PADDED_VERSION=$(printf "alpha-1.%02d" $NEW_VERSION_CODE)
          echo "new_version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "padded_version=$PADDED_VERSION" >> $GITHUB_OUTPUT
          echo "New versionCode: $NEW_VERSION_CODE (tag: $PADDED_VERSION)"

      - name: Update versionCode in build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.bump.outputs.new_version_code }}/" android/app/build.gradle.kts
          echo "Updated versionCode to ${{ steps.bump.outputs.new_version_code }}"

      - name: Build with Gradle
        run: |
          /tmp/gradle-8.12.1/bin/gradle -p android assembleDebug assembleRelease --no-daemon --stacktrace --build-cache

      - name: Display APK info
        run: |
          echo "=== APK Files ==="
          ls -la android/app/build/outputs/apk/ 2>/dev/null || echo "No APK output directory"
          echo ""
          echo "=== Debug APK ==="
          du -h android/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK"
          echo "=== Release APK ==="
          du -h android/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptid-scholar-debug-apk-v${{ steps.bump.outputs.new_version_code }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptid-scholar-release-apk-v${{ steps.bump.outputs.new_version_code }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Commit version bump back to repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add android/app/build.gradle.kts
          git commit -m "chore: bump versionCode to ${{ steps.bump.outputs.new_version_code }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push skipped (cannot push to protected branch)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.padded_version }}
          name: ${{ steps.bump.outputs.padded_version }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## Cryptid Scholar - ${{ steps.bump.outputs.padded_version }}
            
            ### APK Files
            
            - **Debug APK**: [`cryptid-scholar-debug-apk-v${{ steps.bump.outputs.new_version_code }}.apk`](https://github.com/Nights-Projects/Cryptid-Scholar/releases/download/${{ steps.bump.outputs.padded_version }}/cryptid-scholar-debug-apk-v${{ steps.bump.outputs.new_version_code }}.apk)
              - Includes debug logging enabled
              - Logs saved to `/documents/cryptid-scholar-logs/` (max 8MB per file, 3 rotated logs)
              - For troubleshooting only
            
            - **Release APK**: [`cryptid-scholar-release-apk-v${{ steps.bump.outputs.new_version_code }}.apk`](https://github.com/Nights-Projects/Cryptid-Scholar/releases/download/${{ steps.bump.outputs.padded_version }}/cryptid-scholar-release-apk-v${{ steps.bump.outputs.new_version_code }}.apk)
              - Production ready, signed for release
            
            ### Debug Logging
            
            The debug APK includes rotating log files:
            - Location: `/documents/cryptid-scholar-logs/`
            - Max file size: 8MB
            - Rotation: Up to 3 log files (debug.log, debug-1.log, debug-2.log)
            - Enable: Debug builds only (BUILD_TYPE=debug)
            
            ### Installation
            
            Debug APK requires enabling "Install unknown apps" on your device.
            Release APK is signed and ready for distribution.