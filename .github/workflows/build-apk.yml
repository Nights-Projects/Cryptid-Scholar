name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "android/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download and extract Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.12.1-bin.zip -o /tmp/gradle.zip
          python3 -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" /tmp/gradle.zip /tmp
          # Fix permission via base permissions, not chmod (chmod might be blocked by sandbox)
          chmod 755 /tmp/gradle-8.12.1/bin/gradle

      - name: Build with Gradle (no wrapper)
        run: |
          /tmp/gradle-8.12.1/bin/gradle -p android assembleDebug assembleRelease --no-daemon --stacktrace --build-cache

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryptid-scholar-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Display APK info
        run: |
          echo "=== APK Files ==="
          ls -la android/app/build/outputs/apk/
          echo ""
          echo "=== Debug APK ==="
          du -h android/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK"
          echo "=== Release APK ==="
          du -h android/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK"
