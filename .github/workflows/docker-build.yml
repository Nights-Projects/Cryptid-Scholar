name: CI and Docker Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy

      - name: Lint Python with Ruff
        run: ruff check app.py admin_interface.py rebuild_database.py download_images.py generate_placeholders.py generate_icons.py crawl_new_cryptids.py

      - name: Validate Admin HTML structure
        run: |
          python -c "from admin_interface import ADMIN_TEMPLATE; assert '<!DOCTYPE html>' in ADMIN_TEMPLATE; assert 'admin' in ADMIN_TEMPLATE.lower(); print('✓ Admin HTML structure valid')"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build database from seed
        run: |
          python rebuild_database.py --json-input cryptids_seed.json

      - name: Run tests
        run: |
          python -c "import sqlite3; from pathlib import Path; assert Path('cryptid_scholar.db').exists(); conn = sqlite3.connect('cryptid_scholar.db'); cur = conn.cursor(); cur.execute('SELECT COUNT(*) FROM cryptids'); total = cur.fetchone()[0]; print(f'✓ Database valid: {total} cryptids'); assert total > 0; conn.close()"
          python -c "import json; cryptids = json.load(open('cryptids_seed.json')); assert len(cryptids) > 0; print(f'✓ Seed JSON valid: {len(cryptids)} cryptids')"
          python -c "from admin_interface import admin_bp; assert admin_bp is not None; print('✓ Admin blueprint registered')"
          python -c "from app import app; assert app is not None; print('✓ Flask app imports successfully')"

  build-and-push:
    name: Build and Push Docker Image
    needs: [security-scan, lint, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        if: always()
        run: |
          echo "## Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \ `ghcr.io/${{ github.repository }}\` >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \ `${{ github.ref_name }}\` >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \ `${{ github.sha }}\` >> $GITHUB_STEP_SUMMARY
